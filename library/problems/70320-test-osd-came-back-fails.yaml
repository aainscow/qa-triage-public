id: "70320"
tracker: https://tracker.ceph.com/issues/70320
title: "test_osd_came_back fails when test does not detect that osd.0 is back in"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/67659
    branch: main
    fixed_in: v20.3.0-5954-g90a21b540f
tree: test/unittest
facts:
  test: '^tasks\.mgr\.test_progress\.TestProgress\.test_osd_came_back$'
  error: '^IndexError: list index out of range'
match:
  reason: 'test_osd_came_back'
confirm:
  - file: teuthology.log
    pattern: "new_event = self\\._get_osd_in_out_events\\('in'\\)\\[0\\]"
  - file: teuthology.log
    pattern: "IndexError: list index out of range"
notes: |
  In tasks.mgr.test_progress.TestProgress.test_osd_came_back, the test simulates an OSD
  being marked out and then marked back in. During _simulate_back_in, the test calls
  `self._get_osd_in_out_events('in')[0]`. Due to a race condition where progress events
  could complete and disappear between checking event counts and fetching the event,
  `_get_osd_in_out_events('in')` returns an empty list, raising `IndexError: list index out of range`.
  Fixed in PR #67659 by refactoring to atomically capture events during the wait condition check.
