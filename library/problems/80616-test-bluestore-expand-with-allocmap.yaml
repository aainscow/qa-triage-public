id: "80616"
tracker: https://tracker.ceph.com/issues/80616
title: "TEST_bluestore_expand_with_allocmap_recovery: return 1"
kind: test
tree: workunit/standalone
facts:
  script: '^osd/osd-bluefs-volume-ops\.sh$'
  test: '^TEST_bluestore_expand_with_allocmap_recovery$'
match:
  reason: 'osd/osd-bluefs-volume-ops\.sh'
confirm:
  - file: teuthology.log
    pattern: 'too many arguments: \[--auth-supported=none\]'
notes: |
  TEST_bluestore_expand_with_allocmap_recovery in qa/standalone/osd/osd-bluefs-volume-ops.sh
  sets CEPH_ARGS with '--auth-supported=none' instead of the
  '--auth_cluster_required=none --auth_service_required=none --auth_client_required=none'
  used by the other standalone tests. run_mon passes CEPH_ARGS to 'ceph-mon --mkfs', which
  rejects it with 'too many arguments: [--auth-supported=none]', so run_mon returns 1 at
  osd-bluefs-volume-ops.sh:504 before any OSD starts. A qa commit (875eab6) updated the auth
  configs but missed this test. Fix PR https://github.com/ceph/ceph/pull/71975 was open when
  this record was written.
