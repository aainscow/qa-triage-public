id: "77110"
tracker: https://tracker.ceph.com/issues/77110
title: "rados/cephadm: wait_until_healthy times out due to CEPHADM_STRAY_DAEMON HEALTH_WARN"
kind: test
match:
  reason: 'CEPHADM_STRAY_DAEMON|timeout expired in wait_until_healthy'
confirm:
  - file: teuthology.log
    pattern: '"CEPHADM_STRAY_DAEMON":\{"severity":"HEALTH_WARN"'
exclude:
  - file: teuthology.log
    pattern: '^failure_reason: \W{0,2}\d{4}-\d{2}-\d{2}T'
notes: |
  The cephadm task ends with wait_until_healthy, which waits for full HEALTH_OK
  (or only the expected checks) for up to 300s. The cluster stays in HEALTH_WARN
  with CEPHADM_STRAY_DAEMON only ("1 stray daemon(s) not managed by cephadm"), so
  the wait times out. CEPHADM_STRAY_DAEMON is in the job's log-ignorelist, but
  that only filters the final cluster-log scan; it does not make
  wait_until_healthy accept the warning. In one job the cluster log names the
  daemon: "stray daemon osd.7 on host trial059 not managed by cephadm", an OSD that
  had just been added with "ceph orch daemon add osd". The mgr log shows
  _check_for_strays ran right after the active mgr restarted
  (stray_daemon_check_interval = 1800), so the warning was not re-evaluated within
  the 300s wait.
  Inferred, not shown by the logs: that the stray check ran before cephadm had
  registered the new OSD and was not repeated in time. The tracker (status New)
  gives only the symptom and the ignorelist observation.
  The confirm check is the stray-daemon health check in the wait's own polls; the
  timeout itself is a symptom. The cluster log's 'stray daemon X on host Y' line is
  not a check, because not every job has it: in job
  skanta-2026-07-10_04:56:13-rados-wip-bharath8-testing-2026-07-08-0700-distro-default-trial/352418
  neither node's ceph.log.gz holds any stray line, though every health poll from
  08:14:41 to 08:19:43 showed CEPHADM_STRAY_DAEMON alone.
  The exclude keeps out jobs whose failure_reason (in the summary at the end of
  teuthology.log) is a quoted cluster-log line, such as the teardown cluster-log scan
  of 64872 quoting 'Health check failed: 1 stray daemon(s) not managed by cephadm
  (CEPHADM_STRAY_DAEMON)" in cluster log': they did not fail on the
  wait_until_healthy timeout.
examples:
  - pdonnell-2026-10-19_23:53:32-rados-wip-pdonnell-testing-20261019.181708-main-distro-default-trial/658999
  - skanta-2026-07-02_01:10:52-rados-wip-bharath2-testing-2026-07-01-2021-distro-default-trial/335063
  - skanta-2026-07-19_00:55:49-rados-wip-bharath5-testing-2026-07-19-0500-distro-default-trial/376404
  - skanta-2026-07-10_04:56:13-rados-wip-bharath8-testing-2026-07-08-0700-distro-default-trial/352418
also:
  - "64872"
  - "77865"
learned:
- "2026-10-30 bob-analyst, from skanta-2026-07-10_04:56:13-rados-wip-bharath8-testing-2026-07-08-0700-distro-default-trial/352418, as the QA reviewers and the tracker, via qa_triage (bob-analyst) said"
