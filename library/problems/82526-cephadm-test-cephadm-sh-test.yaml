id: "82526"
tracker: https://tracker.ceph.com/issues/82526
title: "cephadm/test_cephadm.sh: test fails due to mismatched container and cephadm releases"
kind: test
tree: workunit/set-e/cephadm-release-mismatch
facts:
  script: '^cephadm/test_cephadm\.sh$'
match:
  reason: 'workunit test cephadm/test_cephadm\.sh'
confirm:
  - file: teuthology.log
    pattern: 'Container release \S+ != cephadm release \S+'
notes: |
  qa/workunits/cephadm/test_cephadm.sh runs `cephadm --image quay.ceph.io/ceph-ci/ceph:main bootstrap ...`
  to bootstrap a cluster. When running on a release branch (such as umbrella) where the main container
  image has a newer release name (e.g. vampire), cephadm aborts the bootstrap with
  "Error: Container release vampire != cephadm release umbrella; please use matching version of cephadm (pass --allow-mismatched-release to continue anyway)".
  The script runs with set -e and fails immediately.
examples:
  - skanta-2026-11-03_06:27:24-rados-wip-bharath11-testing-20261028.083425-main-distro-default-trial/707131
learned:
- "2026-11-05 Bob, from skanta-2026-11-03_06:27:24-rados-wip-bharath11-testing-20261028.083425-main-distro-default-trial/707131, as qa_triage (bob+files) said"
